*{box-sizing:border-box}body{margin:0;background:#131b17;color:#ede4cf;font:16px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:36px 24px}a{color:#8bd4c1}h1{font-size:32px;margin:20px 0 8px}h2{font-size:20px;color:#d6bb80;margin:40px 0 16px}.intro{color:#aeb5a4;max-width:740px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}figure{margin:0;padding:18px 12px;border:1px solid #455142;border-radius:12px;background:repeating-conic-gradient(#2b3328 0% 25%,#242c23 0% 50%) 50%/24px 24px;display:flex;flex-direction:column;justify-content:end;align-items:center;min-height:220px}.strip{width:var(--size);height:var(--size);background-size:var(--width) var(--size);animation:walk .75s steps(var(--frames)) infinite}@keyframes walk{to{background-position:calc(-1*var(--width)) 0}}figcaption{margin-top:14px;color:#e4d4ae}small{display:block;font-size:11px;color:#98a68f}img{width:128px;height:128px;object-fit:contain}button{padding:10px 20px;border:1px solid #819176;border-radius:6px;background:#283627;color:#e9dfc9;cursor:pointer;margin-top:14px}.paused .strip{animation-play-state:paused}.floor{width:100%;height:auto;border-radius:12px}@media(prefers-reduced-motion:reduce){.strip{animation:none}}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}figure{padding:10px;min-height:195px}.strip{transform:scale(.75);transform-origin:50% 100%;margin-top:-32px}h1{font-size:24px}}
</style><main><a href="/?v=0.5">← 返回游戏</a><h1>从静态角色，到会行动的战场。</h1><p class="intro">v0.5 · 五位英雄、五类敌人，共 50 帧移动动画。统一手绘轮廓、共享缩放与底部锚点。棋盘背景展示真实透明边缘；动画可以暂停以检查单帧。</p><button id="toggle" aria-pressed="false">暂停动画</button><section><h2>五位英雄 · 六帧移动循环</h2><div class="grid"><figure><div class="strip" style="--frames:6;--size:128px;--width:768px;background-image:url(assets/v2/gunner-run.png)"></div><figcaption>时间枪手<small>6 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:6;--size:128px;--width:768px;background-image:url(assets/v2/knight-run.png)"></div><figcaption>灰烬骑士<small>6 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:6;--size:128px;--width:768px;background-image:url(assets/v5/frost-run.png)"></div><figcaption>霜环术士<small>6 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:6;--size:128px;--width:768px;background-image:url(assets/v5/engineer-run.png)"></div><figcaption>机巧召唤师<small>6 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:6;--size:128px;--width:768px;background-image:url(assets/v5/reaper-run.png)"></div><figcaption>血刃猎手<small>6 帧 · 128 × 128</small></figcaption></figure></div></section><section><h2>五类敌人 · 四帧移动循环</h2><div class="grid"><figure><div class="strip" style="--frames:4;--size:128px;--width:512px;background-image:url(assets/v5/enemy-husk-run.png)"></div><figcaption>骨兵<small>4 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:4;--size:128px;--width:512px;background-image:url(assets/v5/enemy-runner-run.png)"></div><figcaption>疾行魔<small>4 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:4;--size:128px;--width:512px;background-image:url(assets/v5/enemy-archer-run.png)"></div><figcaption>弩手<small>4 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:4;--size:128px;--width:512px;background-image:url(assets/v5/enemy-elite-run.png)"></div><figcaption>深渊守卫<small>4 帧 · 128 × 128</small></figcaption></figure><figure><div class="strip" style="--frames:4;--size:192px;--width:768px;background-image:url(assets/v5/enemy-boss-run.png)"></div><figcaption>裂隙领主<small>4 帧 · 192 × 192</small></figcaption></figure></div></section><section><h2>炮台与手绘技能图标</h2><div class="grid"><figure><img src="assets/v5/turret.png" alt="青铜双管炮台"><figcaption>青铜双管炮台</figcaption></figure><figure><img src="assets/v5/icon-frost-step.png" alt="霜步"><figcaption>霜步</figcaption></figure><figure><img src="assets/v5/icon-frost-zone.png" alt="寒霜领域"><figcaption>寒霜领域</figcaption></figure><figure><img src="assets/v5/icon-frost-bolt.png" alt="极寒冰封"><figcaption>极寒冰封</figcaption></figure><figure><img src="assets/v5/icon-engineer-swap.png" alt="磁力跃迁"><figcaption>磁力跃迁</figcaption></figure><figure><img src="assets/v5/icon-engineer-turret.png" alt="部署炮台"><figcaption>部署炮台</figcaption></figure><figure><img src="assets/v5/icon-engineer-army.png" alt="机械军团"><figcaption>机械军团</figcaption></figure><figure><img src="assets/v5/icon-reaper-dash.png" alt="血影突刺"><figcaption>血影突刺</figcaption></figure><figure><img src="assets/v5/icon-reaper-drain.png" alt="汲血斩"><figcaption>汲血斩</figcaption></figure><figure><img src="assets/v5/icon-reaper-harvest.png" alt="猩红收割"><figcaption>猩红收割</figcaption></figure></div></section><section><h2>石质竞技场</h2><img class="floor" src="assets/v2/arena-floor.webp" alt="石质竞技场"></section><p class="intro">本次新增 38 帧。当前动画覆盖移动，攻击、受击、闪避、技能与待机呼吸仍由程序实现。游戏中的播放速度会按角色类型区分。</p></main><script>document.getElementById('toggle').addEventListener('click',e=>{const paused=document.body.classList.toggle('paused');e.target.textContent=paused?'播放动画':'暂停动画';e.target.setAttribute('aria-pressed',String(paused));});</script></html>
