<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裂隙工坊 · v0.9资源图鉴</title><style>*{box-sizing:border-box}body{background:#141f1a;color:#e9dfc1;font:15px/1.6 system-ui;margin:0}main{max-width:1120px;margin:auto;padding:38px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #47563b;padding-bottom:25px}h1{font-size:32px;margin:0}p{color:#aebba2}a{color:#ddc488}h2{font-size:22px;margin:32px 0 14px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:radial-gradient(circle at 50% 35%,#566a403d,transparent 68%),#202e24;border:1px solid #4d5c3d;border-radius:5px;display:flex;align-items:center;flex-direction:column;padding:14px 8px}.card img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 5px 4px #02080688)}.card b{font-size:12px;margin-top:8px}.music{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.music article{background:#253429;padding:20px;border:1px solid #4d5c3d}.music audio{width:100%;margin-top:14px}.music p{font-size:12px;margin:5px 0}small{color:#aebba2}footer{border-top:1px solid #47563b;margin-top:30px;padding-top:15px;font-size:12px;color:#aebba2}@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.card img{width:80px;height:80px}.music{grid-template-columns:1fr}h1{font-size:24px}header{gap:15px}}</style><main><header><div><small>RIFT SURVIVORS / ART & MUSIC</small><h1>裂隙工坊</h1><p>手绘装备 · 战术道具 · 四段原创战斗编曲</p></div><a href="./?v=0.9">进入竞技场 ↗</a></header><h2>十二种武器</h2><div class="grid" id="weapons"></div><h2>三十件道具</h2><div class="grid" id="items"></div><h2>战斗配乐</h2><p>拨弦、弓弦、钟音和鼓组，按波次切换；点击播放独立试听。</p><div class="music" id="music"></div><footer>图形：内置图像生成工具制作，透明精灵归一化。音乐：项目原创程序编曲与合成乐器，不含外部音乐采样。音效：沿用 Kenney CC0 样本。</footer></main><script>
const weapons=[['dagger','疾影匕首'],['spear','守卫长矛'],['hammer','裂岩重锤'],['boomerang','回旋刃'],['pistol','游侠手枪'],['smg','连发枪'],['shotgun','碎星霰弹'],['crossbow','穿透弩'],['ice','冰晶杖'],['bomb','爆破器'],['scythe','汲血镰'],['deployer','哨戒部署器']];
const items=[['coldcrit','寒霜透镜'],['shards','裂隙碎片'],['wallbang','震荡铁砧'],['overheal','余烬护符'],['siege','阵地核心'],['pierce','贯通弹芯'],['ricochet','回响导体'],['shatter','碎冰刻印'],['edge','磨刃石'],['scope','精密瞄具'],['ember','元素火种'],['gear','精密齿轮'],['boots','轻羽靴'],['plate','重装甲片'],['heart','生命火种'],['trigger','轻型扳机'],['power','增幅器'],['lens','弱点透镜'],['cloak','幻影披风'],['sap','再生树液'],['fang','汲血獠牙'],['basket','丰收背篓'],['coin','幸运古币'],['magnet','材料磁石'],['medal','决斗勋章'],['ammo','弹药匣'],['battery','奥术电池'],['brick','坚守砖石'],['clover','收获四叶草'],['contract','危险契约']];
for(const [key,data]of [['weapons',weapons],['items',items]])document.querySelector('#'+key).innerHTML=data.map(([id,name])=>`<article class="card"><img src="assets/v9/${key}/${id}.png" alt="${name}"><b>${name}</b></article>`).join('');
const tracks=[['first-light','初光','1–3波 · 108 BPM · 留白与拨弦'],['iron-march','铁行','4–7波 · 118 BPM · 行进鼓与钟音'],['rift-storm','裂隙风暴','8–11波 · 128 BPM · 弦乐与对位'],['last-guardian','最后的守卫','第12波 · 136 BPM · 密集鼓组与高潮']];
document.querySelector('#music').innerHTML=tracks.map(([id,name,desc])=>`<article><b>${name}</b><p>${desc}</p><audio controls preload="none" src="assets/audio/v9/${id}.m4a"></audio></article>`).join('');
document.querySelectorAll('audio').forEach(a=>a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause();})));
</script></html>
